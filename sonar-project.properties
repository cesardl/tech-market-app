# must be unique in a given SonarQube instance
sonar.projectKey=pe.edu.unmsm.fisi.tech-market-app

# this is the name and version displayed in the SonarQube UI. Was mandatory prior to SonarQube 6.1.
sonar.projectName=Tech Market Application
sonar.projectVersion=1.0.0-SNAPSHOT

sonar.links.homepage=https://github.com/cesardl/tech-market-app

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# This property is optional if sonar.modules is set.
sonar.java.source=21
sonar.sources=src/main/
sonar.java.binaries=target/

# Coverage produced by the jacoco-maven-plugin 'report' goal (bound to the test phase)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
